<html lang="en">

<x-dc>

<div style="flex: 1"></div>
<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3 L12 9 L6 15"></path></svg>

<div style="height: 54px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; opacity: 0.85">

<div style="height: 54px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; opacity: 0.85">

<div style="flex: 1"></div>
<span style="font-size: 20px; font-weight: 700; border: 2px solid currentColor; border-radius: 6px; padding: 0 8px">ON</span>

<div style="height: 54px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; opacity: 0.85">

</div>

<script type="text/x-dc" data-dc-script data-props='{"g":{"editor":"color","default":"#3DFF8A","options":["#3DFF8A","#7CFFB0","#00E676"]},"$preview":{"width":480,"height":398}}'>
